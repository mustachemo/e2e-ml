# ==============================================================================
# Docker Compose for E2E ML Pipeline
# ==============================================================================

services:
  # =============================== ML Pipeline ============================== #
  ml-pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile.gpu.amd
    devices:
      - /dev/kfd
      - /dev/dri
    security_opt:
      - seccomp=unconfined

    group_add:
      - "44" # video group - for /dev/dri/card* access
      - "992" # render group - for /dev/kfd and /dev/dri/renderD* access
    ipc: host
    shm_size: 8G

    container_name: e2e-ml-pipeline
    volumes:
      - .:/app
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-ui:5000
    depends_on:
      - mlflow-ui
    networks:
      - ml-network
    command:
      #   ["python", "main.py", "mode=train", "data.batch_size=32", "mlflow=docker"]
      ["bash", "-lc", "sleep infinity"]
  # =============================== MLflow UI ================================ #
  mlflow-ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    container_name: e2e-ml-mlflow-ui
    ports:
      - "5000:5000"
    volumes:
      - ./output:/app/mlruns
    environment:
      - MLFLOW_BACKEND_STORE_URI=file:/app/mlruns
    networks:
      - ml-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  ml-network:
    driver: bridge
