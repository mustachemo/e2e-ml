# @package training

# =============================== Training Parameters ====================== #
epochs: 50
learning_rate: 0.001
weight_decay: 1e-4
momentum: 0.9

# =============================== Optimizer ================================ #
optimizer:
  _target_: torch.optim.SGD
  lr: ${training.learning_rate}
  weight_decay: ${training.weight_decay}
  momentum: ${training.momentum}

# =============================== Scheduler ================================ #
scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: ${training.epochs}
  eta_min: 0.0001

# =============================== Loss Function ============================ #
loss_function:
  _target_: torch.nn.CrossEntropyLoss
  label_smoothing: 0.1

# =============================== Early Stopping =========================== #
early_stopping:
  enabled: true
  patience: 10
  min_delta: 0.001
  monitor: "val_loss"
  mode: "min"

# =============================== Checkpointing ============================ #
checkpointing:
  enabled: true
  save_top_k: 5
  monitor: "val_accuracy"
  mode: "max"
  save_last: true

# =============================== Validation =============================== #
val_check_interval: 1.0
log_every_n_steps: 100

# =============================== Mixed Precision ========================== #
mixed_precision:
  enabled: true
  loss_scale: "dynamic"
